# Öffentliche Subdomain für Desksharing.
# desksharing-setup-database setzt server_name aus PUBLIC_BASE_URL und aktiviert
# die Site. Zertifikat danach:
#   certbot --nginx -d <server_name>
# PUBLIC_BASE_URL in /etc/desksharing/desksharing.env muss https://<server_name> sein.
#
# Der Go-Prozess hört nur auf 127.0.0.1:8081. TRUST_PROXY=true wertet X-Real-IP aus.
# Diese Datei setzt X-Real-IP auf $remote_addr und überschreibt damit einen vom
# Client mitgeschickten Header. Bis das Zertifikat da ist, bleibt die Site auf
# Port 80, damit Certbot die TLS-Blöcke selbst ergänzen kann.

server {
    listen 80;
    listen [::]:80;
    server_name desksharing.example.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
